[platformio]
default_envs = esp32-test


[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -Wall
  -Wextra


; Current standard ESP32 — hardware-free testing
[env:esp32-test]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DTEST_MODE=1


; Future ESP32-S3 N16R8 — hardware-free testing
[env:esp32-s3-test]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags =
  ${env.build_flags}
  -DTEST_MODE=1
  -DBOARD_HAS_PSRAM


; Future ESP32-S3 N16R8 — motors and sensor connected
[env:esp32-s3-hardware]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags =
  ${env.build_flags}
  -DTEST_MODE=0
  -DBOARD_HAS_PSRAM