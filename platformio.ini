[platformio]
default_envs = esp32-test


[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -Wall
  -Wextra


; ESP32-WROOM-32U — hardware-free testing (motors simulated)
[env:esp32-test]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DTEST_MODE=1


; ESP32-WROOM-32U — propulsion, tether winch, and sensor connected
[env:esp32-hardware]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DTEST_MODE=0
