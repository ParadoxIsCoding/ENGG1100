[platformio]
default_envs = esp32-test


[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -Wall
  -Wextra


; Standard ESP32 (esp32dev / ESP32-D0WD-V3 DevKit) — hardware-free testing,
; motors and MPU6050 simulated. Safe default for `pio run` with no board
; connected.
[env:esp32-test]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DTEST_MODE=1


; Standard ESP32 (esp32dev / ESP32-D0WD-V3 DevKit) — the board currently
; wired on the bench. Two L9110S drivers (8 motor-control GPIOs) and an
; optional GY-521 MPU6050 are live. Select this environment to upload to
; the physically connected board; see README.md for the safe first-power
; procedure before connecting motor power.
[env:esp32-hardware]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DTEST_MODE=0


; Future ESP32-S3 N16R8 — hardware-free testing. Not physically wired yet.
[env:esp32-s3-test]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags =
  ${env.build_flags}
  -DTEST_MODE=1
  -DBOARD_S3=1
  -DBOARD_HAS_PSRAM


; Future ESP32-S3 N16R8 — hardware build. Pin map in include/config.h is a
; placeholder only; verify it against the real S3 wiring before use.
[env:esp32-s3-hardware]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags =
  ${env.build_flags}
  -DTEST_MODE=0
  -DBOARD_S3=1
  -DBOARD_HAS_PSRAM
